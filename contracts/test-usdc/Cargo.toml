[package]
name = "test-usdc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Test-only NEP-141 token (6 decimals) for the testnet demo. No value."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
