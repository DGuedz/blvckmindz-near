[package]
name = "track-account"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Each track is an account: registered split, USDC invoices, gated payout, public receipt."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
